# Selected via `mkosi --profile=mqs build`.

[Output]
Output=mechanix-os-qemu-simu
ImageId=mechanix-os-qemu-simu

[Distribution]
Architecture=x86-64

[Content]
ExtraTrees=mkosi.extra.mqs.comet
Packages=
## the goat linux kernal
    kernel

## base ackages

    @core
    @networkmanager-submodules
    @standard
    htop
    nano
    NetworkManager-config-connectivity-fedora
    nss
    openssh-server
    openssl
    seatd
    sudo
    systemd
    systemd-boot-unsigned
    systemd-pam
    systemd-udev
    xdg-user-dirs

## hardware packages (I dont think we need in qemu Optional)
    bluez
    bluez-obexd
    can-utils
    cpufrequtils
    evtest
    i2c-tools
    libcamera
    libcamera-devel
    libgpiod-utils
    linux-firmware-imx-sdma
    mesa-demos
    upower
    usbutils
    # SSH over USB
    dnsmasq
    # USB mode manager
    usb-signaller
    # Custom packages

## GUIs

    @base-graphical
    alacritty
    fontawesome-fonts-all
    greetd
    gsettings-desktop-schemas
    gnome-keyring
    gnome-keyring-pam
    jetbrains-mono-fonts
    mutter
    weston-demo
    xorg-x11-server-Xwayland

# Pre GUIs
	weston # lightest wayland compositer
    nwg-bar
    nwg-drawer
    waybar
    wlopm
    wlrctl

# Audio/video/graphics stack (No need Optional)

    @multimedia
    gstreamer
    gstreamer-devel
    libpdfium
    mpv
    mpv-devel
    mpv-libs

Initrds=default

[Build]
ToolsTreePackages=qemu-ui-sdl
SandboxTrees=

[Runtime]
TPM=no
Console=gui
QemuArgs=-display vnc=:0
CPUs=4
RAM=4G
